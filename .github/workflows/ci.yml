name: CodeGuard AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./packages/code-intelligence" -e "./apps/api[dev]" -e "./apps/mcp-server"

      - name: Run Ruff Lint
        run: |
          ruff check apps/api apps/mcp-server packages/code-intelligence

      - name: Run Pytest Suite
        env:
          APP_ENV: test
          GITHUB_WEBHOOK_SECRET: test-webhook-secret-ci
          SECRET_KEY: test-secret-key-at-least-32-characters-long
          DEV_AUTH_BYPASS: true
          CELERY_TASK_ALWAYS_EAGER: true
        run: |
          pytest apps/api/tests apps/mcp-server/tests -v

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "apps/web/package.json"

      - name: Install dependencies
        working-directory: apps/web
        run: npm install

      - name: Lint Next.js Dashboard
        working-directory: apps/web
        run: npm run lint

      - name: Build Next.js Dashboard
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API & Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: codeguard-api:ci-test

      - name: Build MCP Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/mcp-server
          file: ./apps/mcp-server/Dockerfile
          push: false
          tags: codeguard-mcp:ci-test

      - name: Build Web Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: codeguard-web:ci-test
